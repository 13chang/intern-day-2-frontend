services:
  frontend:
    build: .
    image: intern-day-2-frontend:local
    container_name: intern-day-2-frontend
    ports:
      # 宿主机 5174 -> 容器 5173。
      # 宿主机 5173 留给 VS Code devcontainer 那套（它固定 5173），
      # 两套并存时抢同一个宿主端口，后起的直接 bind 失败。
      - "5174:5173"
    environment:
      # 浏览器访问的 API 基地址，需与后端 CORS 放行的来源一致。
      #
      # **这里硬编码、不走 ${} 插值**：compose 的变量插值会读本目录的 .env，
      # 而那个文件是给 devcontainer 用的是 http://127.0.0.1:8000。
      # 一旦走插值，compose 的前端就会指到宿主 8000 —— 那正好是
      # devcontainer 的那套后端，于是"页面能开、数据却是另一套的"，
      # 排查起来极难想到是端口配置串了。
      VITE_API_BASE_URL: "http://127.0.0.1:8001"
      # Vite 同源代理的目标：compose 里 Runtime 是独立服务，用服务名访问。
      # 浏览器不再直接访问 4000，也就不会和宿主机上别的容器抢这个端口。
      RUNTIME_PROXY_TARGET: "http://runtime:4000"
    restart: unless-stopped

  # 第三天新增：CopilotKit Runtime。
  # 和前端用同一份镜像，只是换启动命令，避免重复构建一遍依赖。
  runtime:
    build: .
    image: intern-day-2-frontend:local
    container_name: intern-day-2-runtime
    command: ["node", "server/index.mjs"]
    ports:
      # 宿主机 4000 常被别的项目占用（这台机器上是 agentdemo 的 Runtime），
      # 直接映射 4000 会让本服务起不来。容器内仍监听 4000，只把宿主机侧换成 4123；
      # Android App 里用 10.0.2.2:4123 访问。
      - "4123:4000"
    environment:
      PORT: "4000"
      # 必须和前端 CopilotKitProvider 的 agentId 一致
      AGENT_ID: "todo-agent"
      # 后端属于另一个 Compose 项目，服务名不能互相解析，
      # 所以走 compose 的 host-gateway 访问宿主机映射出来的 8001 端口。
      #
      # 同样硬编码、不走 ${} 插值：.env 里的 AGENT_URL 指向 devcontainer 的 8000，
      # 插值会把 compose 的 Runtime 也指过去，两套后端的数据就串在一起了。
      AGENT_URL: "http://host.docker.internal:8001/agent"
      # 除了浏览器来源，还要放行 Capacitor App 的 WebView 来源（http://localhost，不带端口）
      RUNTIME_CORS_ORIGINS: "${RUNTIME_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost}"
      # 上游多久没有输出就主动结束本次运行，避免后端假死时页面一直转圈
      STREAM_IDLE_TIMEOUT_MS: "${STREAM_IDLE_TIMEOUT_MS:-20000}"
      # 练习项目不需要把使用数据发到第三方，默认关掉
      COPILOTKIT_TELEMETRY_DISABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
